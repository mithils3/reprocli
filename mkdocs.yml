site_name: ReproBench
site_description: >-
  A benchmark for reproducing ML-paper claims — one lockfile, three LLM agent
  roles (classifier, reproduction, auditor) over a single tool-calling core.
site_author: mithils3
# Public docs URL (GitHub Pages project site). Used for the sitemap + canonical
# links. Change this if you host the built site/ elsewhere (Vercel, Netlify, RTD).
site_url: https://mithils3.github.io/reprocli/

repo_url: https://github.com/mithils3/reprocli
repo_name: mithils3/reprocli
edit_uri: edit/main/docs/

docs_dir: docs
# Keep build artifacts out of the repo tree (also gitignored).
site_dir: site

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  status:
    live: live
    designed: designed, not yet wired
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mithils3/reprocli

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Key concepts: getting-started/concepts.md
  - Architecture: architecture.md
  - The agent core:
      - Overview: agent-core/index.md
      - Runtime & tool loop: agent-core/tool-loop.md
      - Guardrails & termination: agent-core/guardrails.md
      - Structured output: agent-core/structured-output.md
  - Agent modes:
      - Classifier: modes/classifier.md
      - Auditor: modes/auditor.md
      - Reproduction (designed): modes/reproduction.md
  - Dataset pipeline:
      - Overview: dataset/index.md
      - Stages: dataset/stages.md
      - Bundle schema: dataset/bundle-schema.md
  - Lockfile & selection:
      - The lockfile: selection/lockfile.md
      - Pool selection: selection/select-pool.md
      - H100 budget & bands: selection/h100-budget.md
  - Tools & schemas:
      - Web / MCP tools: tools/web-tools.md
      - Run-dir tools: tools/run-dir-tools.md
      - Output & audit schemas: tools/schemas.md
  - Running on SLURM:
      - Clusters & allocations: slurm/clusters.md
      - Serving (reprocli-serve): slurm/serve.md
      - Batch jobs: slurm/sbatch.md
  - CLI reference:
      - run_arxiv_prompt_vllm: cli/run-arxiv.md
      - build_dataset: cli/build-dataset.md
  - Review apps:
      - Verification app: apps/verify-app.md
      - v3 viewer: apps/v3-viewer.md
  - Contributing:
      - Repo layout & conventions: contributing/layout.md
      - Testing: contributing/testing.md
