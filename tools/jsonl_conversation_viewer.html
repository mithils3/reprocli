<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReproCLI Output Viewer</title>
  <link rel="stylesheet" href="/tools/jsonl_viewer/styles.css">
  <link rel="stylesheet" href="/tools/jsonl_viewer/chat.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>ReproCLI Output Viewer</h1>
        <p id="sourceLabel">No file loaded</p>
      </div>
      <div class="filebar">
        <select id="serverFileSelect" aria-label="Server JSONL file">
          <option>No server files found</option>
        </select>
        <button id="openServerFile" class="primary">Open</button>
        <label class="upload">Upload<input id="fileInput" type="file" accept=".jsonl,application/json" multiple></label>
      </div>
      <div class="navbuttons">
        <button id="prevRecord" aria-label="Previous record">Prev</button>
        <button id="nextRecord" aria-label="Next record">Next</button>
      </div>
    </header>

    <section class="workspace">
      <aside class="sidebar">
        <div id="dropzone" class="dropzone">
          <strong>Drop JSONL files</strong>
          <span>Load output, trace, extracted, request, or batch-result files together.</span>
        </div>
        <div class="stats">
          <div><strong id="statRecords">0</strong><span>Records</span></div>
          <div><strong id="statTools">0</strong><span>Tool Calls</span></div>
          <div><strong id="statReasoning">0</strong><span>Reasoning</span></div>
          <div><strong id="statTokens">0</strong><span>Tokens</span></div>
        </div>
        <div class="filters">
          <input id="searchInput" type="search" placeholder="Search id, title, tools, answer, JSON">
          <select id="statusFilter">
            <option value="all">All status</option>
            <option value="success">Success</option>
            <option value="request">Requests</option>
            <option value="error">Errors</option>
            <option value="parse_error">Parse errors</option>
          </select>
          <select id="tierFilter"><option value="all">All tiers</option></select>
        </div>
        <div id="recordList" class="records"></div>
      </aside>

      <section class="chatShell">
        <div class="chatHead">
          <div>
            <h2 id="detailTitle">Load a JSONL file</h2>
            <div id="detailMeta" class="meta"></div>
          </div>
          <div class="actions">
            <button id="copyTranscript">Copy Transcript</button>
            <button id="copyJson">Copy JSON</button>
            <button id="downloadFiltered">Download Filtered</button>
            <button id="clearRecords">Clear</button>
          </div>
        </div>
        <div class="mainPane">
          <section id="conversation" class="conversation"></section>
          <aside id="inspector" class="inspector"></aside>
        </div>
      </section>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/tools/jsonl_viewer/record_model.js"></script>
  <script src="/tools/jsonl_viewer/chat_render.js"></script>
  <script src="/tools/jsonl_viewer/app.js"></script>
</body>
</html>
