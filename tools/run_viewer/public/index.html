<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Repro Run Viewer</title>
  <meta name="theme-color" content="#FAF9F5" />
  <!-- set the theme before first paint so there's no light-mode flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="viewer.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button id="sidebar-toggle" class="sidebar-toggle" title="Hide the run list" aria-label="Toggle run list">☰</button>
      <div class="brand">Repro Run Viewer</div>
      <nav class="tabs">
        <button class="tab active" data-view="live">Live runs</button>
        <button class="tab" data-view="stats">Stats</button>
        <button class="tab" data-view="local">Local file</button>
      </nav>
      <div class="who">
        <span id="conn" class="pill"></span>
        <button id="theme-toggle" class="theme-toggle" title="Switch theme" aria-label="Switch theme">☾</button>
      </div>
    </header>

    <!-- LIVE: runs streamed to Supabase -->
    <main id="view-live" class="view layout">
      <aside class="sidebar">
        <input id="search" type="search" placeholder="Search arxiv id or model…" />
        <div class="filters" id="filters"></div>
        <div id="run-list" class="paper-list"></div>
      </aside>
      <section id="live-detail" class="detail">
        <div class="empty">Pick a run from the list to watch it stream in.</div>
      </section>
    </main>

    <!-- STATS: token / turn tallies across all runs -->
    <main id="view-stats" class="view hidden">
      <section class="detail">
        <div id="stats-root" class="stats-wrap"></div>
      </section>
    </main>

    <!-- LOCAL: drop an agent.log / agent.full.log / first_try.log -->
    <main id="view-local" class="view hidden">
      <section id="local-detail" class="detail">
        <div id="drop" class="drop">
          <h2>Drop an agent log here</h2>
          <div class="hint">
            Drag in an <code>agent.log</code>, <code>agent.full.log</code>, or
            <code>first_try.log</code> — or click to choose a file.<br />
            Everything is parsed locally in your browser; nothing is uploaded.
          </div>
          <input id="file" type="file" class="hidden" accept=".log,.txt" />
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="parser.js"></script>
  <script src="render.js"></script>
  <script src="supabase-data.js"></script>
  <script src="stats.js"></script>
  <script src="app.js"></script>
  <script>
    /* theme toggle: flip data-theme, persist, keep icon + browser UI colour in sync */
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      var meta = document.querySelector('meta[name="theme-color"]');
      function sync() {
        var dark = root.getAttribute('data-theme') === 'dark';
        btn.textContent = dark ? '☀' : '☾';
        btn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
        if (meta) meta.setAttribute('content', dark ? '#0c0b0a' : '#FAF9F5');
      }
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        sync();
      });
      sync();
    })();
  </script>
</body>
</html>
